services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: schedule
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: local_dev_only
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule -d schedule"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pgdata: